services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ICAN_DATABASE_URL: sqlite:////data/ican.db
      ICAN_ENVIRONMENT: production
      ICAN_UPLOAD_DIR: /data/uploads
      ICAN_LOG_DIR: /data/logs
      ICAN_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      ICAN_EXPOSE_RESET_TOKEN: "false"
    volumes:
      - ican_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_USE_MOCK: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ican_data:
